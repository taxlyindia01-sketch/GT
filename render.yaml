# render.yaml — Render Blueprint for GoldTrader Pro v4

services:
  - type: web
    name: goldtrader-backend
    runtime: python
    rootDir: backend
    pythonVersion: "3.11.11"
    buildCommand: python --version && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: goldtrader-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: TAXLY_ADMIN_USERNAME
        value: Taxly
      - key: TRIAL_DAYS
        value: "10"
      - key: FRONTEND_URL
        # ⚠️  Set this to your actual Render frontend URL, e.g.:
        # https://goldtrader-frontend.onrender.com
        # Without this set correctly, credentialed CORS requests will be blocked.
        value: "https://goldtrader-frontend.onrender.com"
      - key: GOOGLE_CLIENT_ID
        # ✅ Set — required for Google OAuth login (Bug-2 fix: no fallback without it)
        value: "863366877040-e8bi45pfb3mo1ec03c395g8dbaatvke5.apps.googleusercontent.com"
      - key: DEBUG
        value: "False"
      # NOTE: Set ADMIN_PASSWORD_HASH manually in Render dashboard
      # (bcrypt hashes contain $ signs which break YAML)
      # Value to paste: $2b$12$ZhJuQ.tZKyxLgVT/GqrzBeX20BFpN0sFKhzMBPUW0HbtnYKR8Mlsi
      # This is the bcrypt hash of the password: @Gsf025@

  # ── Financial Year Reset — runs 00:01 IST (= 18:31 UTC) on April 1 ──
  - type: cron
    name: goldtrader-fy-reset
    runtime: python
    rootDir: backend
    pythonVersion: "3.11.11"
    buildCommand: pip install -r requirements.txt
    startCommand: python fy_reset.py
    schedule: "31 18 1 4 *"   # 00:31 IST = 18:31 UTC, April 1
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: goldtrader-db
          property: connectionString

databases:
  - name: goldtrader-db
    databaseName: goldtrader_pro
    user: goldtrader
    plan: free
