# render.yaml — Render Blueprint for GoldTrader Pro v4
# Push this repo to GitHub, then connect it on render.com

services:
  - type: web
    name: goldtrader-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: goldtrader-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: TAXLY_ADMIN_USERNAME
        value: Taxly
      - key: TRIAL_DAYS
        value: "10"
      - key: FRONTEND_URL
        value: "*"
      - key: DEBUG
        value: "False"
      # NOTE: Set ADMIN_PASSWORD_HASH manually in Render dashboard
      # (YAML cannot safely hold bcrypt hashes with $ signs)
      # Value: $2b$12$ZhJuQ.tZKyxLgVT/GqrzBeX20BFpN0sFKhzMBPUW0HbtnYKR8Mlsi
      # (This is the bcrypt hash of: @Gsf025@)

databases:
  - name: goldtrader-db
    databaseName: goldtrader_pro
    user: goldtrader
    plan: free
